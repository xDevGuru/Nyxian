name: Build iOS App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          set -e

          # Packages we desperately need
          brew install ldid dpkg libarchive

      - name: Setup
        run: |
          set -e

      - name: Cache CoreCompilerSupportLibs
        uses: actions/cache@v4
        id: cache-corecompiler
        with:
          path: |
            Frameworks/CoreCompiler/CoreCompilerSupportLibs
            LLVM-On-iOS/CoreCompilerSupportLibs
            LLVM-On-iOS/LLVM.xcframework
          key: ${{ runner.os }}-corecompiler-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-corecompiler-

      - name: Download Prebuilt LLVM Support
        if: steps.cache-corecompiler.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -L https://github.com/SuSuDear/emexDE/releases/download/llvm-support/CoreCompilerSupportLibs.tar.gz.part-aa -o CoreCompilerSupportLibs.tar.gz
          tar -xzf CoreCompilerSupportLibs.tar.gz
          mkdir -p Frameworks/CoreCompiler/CoreCompilerSupportLibs
          cp -r CoreCompilerSupportLibs/* Frameworks/CoreCompiler/CoreCompilerSupportLibs/
          cp -r LLVM.xcframework Frameworks/CoreCompiler/CoreCompilerSupportLibs/
          rm -rf CoreCompilerSupportLibs LLVM.xcframework CoreCompilerSupportLibs.tar.gz

      - name: Build Nyxian
        timeout-minutes: 1200
        run: |
          set -e

          CHECK_DEPS=0 make all

      - name: Upload Nyxian
        uses: actions/upload-artifact@v4
        with:
          name: Nyxian.ipa
          path: Nyxian.ipa
